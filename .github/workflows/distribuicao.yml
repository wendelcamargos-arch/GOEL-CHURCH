name: Firebase App Distribution

on:
  workflow_run:
    workflows: ["Android Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  distribute-android:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${FIREBASE_APP_ID_ANDROID}" || (echo "Missing secret: FIREBASE_APP_ID_ANDROID" && exit 1)
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON}" || (echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          test -n "${FIREBASE_TESTER_GROUPS}" || (echo "Missing secret: FIREBASE_TESTER_GROUPS" && exit 1)

      - name: Materialize Firebase service account
        run: |
          set -euo pipefail
          CREDENTIALS_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${CREDENTIALS_PATH}"
          test -s "${CREDENTIALS_PATH}" || (echo "Service account JSON is empty" && exit 1)
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS=${CREDENTIALS_PATH}"
            echo "GOOGLE_GHA_CREDS_PATH=${CREDENTIALS_PATH}"
          } >> "$GITHUB_ENV"

      - name: Download artifact from successful Android Build run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: android-release-apk
          path: ci-artifacts

      - name: Build artifact for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK in manual dispatch mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          flutter pub get
          cd packages/goel_domain
          dart pub get
          cd ../..
          flutter analyze
          flutter test
          RELEASE_NAME="1.0.${BUILD_NUMBER}"
          flutter build apk --release \
            --build-name="${RELEASE_NAME}" \
            --build-number="${BUILD_NUMBER}"
          mkdir -p ci-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ci-artifacts/app-release.apk
          {
            echo "release_name=${RELEASE_NAME}"
            echo "build_number=${BUILD_NUMBER}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
          } > ci-artifacts/release-metadata.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute APK to Firebase App Distribution
        run: |
          set -euo pipefail
          APK_PATH="ci-artifacts/app-release.apk"
          test -f "${APK_PATH}" || (echo "APK not found at ${APK_PATH}" && exit 1)
          RELEASE_NOTES="Automated release from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          if [ -f ci-artifacts/release-metadata.txt ]; then
            RELEASE_NOTES="$(cat ci-artifacts/release-metadata.txt)"
          fi
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${FIREBASE_APP_ID_ANDROID}" \
            --groups "${FIREBASE_TESTER_GROUPS}" \
            --release-notes "${RELEASE_NOTES}"