name: Slice06 Apply + Test + Supabase Keys

on:
  workflow_dispatch:

jobs:
  run-slice06:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: rzxeqvczjfwcggkgcsxw
      PATCH_FILE: GOEL-CHURCH-mvp-slices-01-07-completo.patch
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_EXPORT_PASSPHRASE: ${{ secrets.SUPABASE_EXPORT_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Dart (optional explicit)
        uses: dart-lang/setup-dart@v1

      - name: Validate cumulative patch file
        run: |
          set -euo pipefail
          if [ ! -f "${PATCH_FILE}" ]; then
            echo "ERRO: patch não encontrado"
            exit 1
          fi

      - name: Apply patch (with 3-way fallback)
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git am < "${PATCH_FILE}"; then
            git am --abort || true
            git am --3way < "${PATCH_FILE}"
          fi

      - name: Flutter pub get + tests
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          flutter pub get
          flutter test
          dart test packages/goel_domain

      - name: Resolve SUPABASE_URL + ANON_KEY
        id: supabase
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERRO: SUPABASE_ACCESS_TOKEN ausente"
            exit 1
          fi

          SUPABASE_URL="https://${PROJECT_REF}.supabase.co"

          API_KEYS_JSON="$(curl -s \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys")"

          ANON_KEY="$(echo "${API_KEYS_JSON}" | jq -r '.[] | select(.name=="anon") | .api_key')"

          if [ -z "${ANON_KEY}" ] || [ "${ANON_KEY}" = "null" ]; then
            echo "ERRO: não foi possível obter ANON_KEY"
            echo "${API_KEYS_JSON}" | jq .
            exit 1
          fi

          echo "::add-mask::${ANON_KEY}"

          echo "SUPABASE_URL=${SUPABASE_URL}" >> "$GITHUB_ENV"
          echo "ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"

          echo "supabase_url=${SUPABASE_URL}" >> "$GITHUB_OUTPUT"
          echo "anon_key=${ANON_KEY}" >> "$GITHUB_OUTPUT"

      - name: Build encrypted export artifact
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_EXPORT_PASSPHRASE:-}" ]; then
            echo "ERRO: SUPABASE_EXPORT_PASSPHRASE ausente"
            exit 1
          fi

          mkdir -p out
          cat > out/supabase-keys.txt <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          ANON_KEY=${ANON_KEY}
          EOF

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in out/supabase-keys.txt \
            -out out/supabase-keys.txt.enc \
            -pass env:SUPABASE_EXPORT_PASSPHRASE

          rm -f out/supabase-keys.txt

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-keys-encrypted
          path: out/supabase-keys.txt.enc
          if-no-files-found: error
          retention-days: 1

      - name: Final summary
        run: |
          set -euo pipefail
          echo "SUPABASE_URL=${SUPABASE_URL}"
          echo "ANON_KEY=***masked***"
          echo "Artifact: supabase-keys-encrypted"
