name: Test APK (homologação)

# Gera um APK ASSINADO apenas para HOMOLOGAÇÃO em dispositivo real.
# NÃO é a Release Candidate (AAB). Uso: aba Actions → "Test APK (homologação)"
# → Run workflow. Instalar o APK direto no aparelho (sideload) para validar.
#
# Reutiliza os mesmos segredos de assinatura do release-aab.yml, para o APK ter
# a MESMA assinatura do app (evita conflito com futura instalação do Play).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolver dependências
        run: flutter pub get

      - name: Resolver deps do pacote de domínio
        run: dart pub get
        working-directory: packages/goel_domain

      - name: Decodificar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Criar key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build do APK assinado (homologação)
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name="1.1.0" \
            --build-number="11"

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: goel-church-apk-homolog
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
