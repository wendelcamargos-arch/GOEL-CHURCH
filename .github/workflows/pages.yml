name: GitHub Pages — Suporte e Privacidade

# Publica APENAS a pasta `site/` como o site público da Goel Church:
#   /              → Suporte do aplicativo
#   /privacidade/  → Política de Privacidade
#
# Publicar só `site/` é proposital: a pasta `docs/` contém documentação
# interna de release e NÃO deve virar site.
#
# Pré-requisito no repositório (feito UMA vez pelo Owner):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma publicação em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
